<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Zoom dell'interfaccia scelto dall'utente, applicato prima del primo disegno:
			// impostarlo dopo l'avvio dell'app farebbe vedere la pagina rimpicciolirsi.
			try {
				var s = parseFloat(localStorage.getItem('digigames:ui-scale'));
				if (s >= 0.8 && s <= 1.6) document.documentElement.style.fontSize = s * 100 + '%';
			} catch (e) {
				/* storage negato: si resta alla dimensione di default */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
