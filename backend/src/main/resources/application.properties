quarkus.application.name=digigames

# ---------- HTTP ----------
quarkus.http.port=8080
# In dev usa 8085 (8080/8081 occupate dallo stack pio/traefik) + CORS per il frontend vite
%dev.quarkus.http.port=8085
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:5173

# ---------- Datasource ----------
# Dev: Dev Services avvia Postgres via Docker automaticamente (nessun url richiesto)
quarkus.datasource.db-kind=postgresql
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql

# Prod (Neon): valori da variabili d'ambiente su Fly.io
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=update

# ---------- JWT ----------
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=minigames
smallrye.jwt.sign.key.location=privateKey.pem
